# Merge into ~/.hermes/config.yaml. Replace the command with the absolute path
# to bin/qmd in your clone. Put TYPESAFE_API_KEY in ~/.hermes/.env for reranking.
mcp_servers:
  qmd:
    command: /Users/YOUR_USER/qmd/bin/qmd
    args: [mcp]
    timeout: 300
    env:
      TYPESAFE_API_KEY: "${TYPESAFE_API_KEY}"
